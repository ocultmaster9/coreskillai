name: Deploy coreskillai.com

# Push to main = deploy to production. This is the ONLY path to production.
# This pipeline belongs to coreskillai.com ALONE. Never merge it with another
# site's workflow - each site deploys independently so one can never break another.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-coreskillai
  cancel-in-progress: false

env:
  PROJECT: coreskillai
  SERVED: https://www.coreskillai.com   # what visitors get (apex 301s here)
  ORIGIN: https://coreskillai.com       # what the HTML itself contains - see note below
  ADSENSE: ca-pub-5798786176755576
  GA4: G-RKSK3LMNKN                     # coreskillai.com's OWN measurement ID

# NOTE ON THE TWO HOSTS
# The Pages origin ships canonicals on the APEX (https://coreskillai.com/...).
# The `coreskillai-canonical-fix` Worker rewrites them to www at the edge, which is
# why the live page shows a www canonical while coreskillai.pages.dev shows the apex.
# So preflight checks the ORIGIN form and the live checks confirm the Worker still
# does its job. Do NOT "fix" the canonicals to www without also retiring that Worker,
# or the rewrite will double-apply.

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ID
        id: build
        run: echo "id=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Stage clean copy
        run: |
          set -euo pipefail
          rm -rf _stage && mkdir -p _stage
          rsync -a ./ _stage/ \
            --exclude '.git' --exclude '.github' --exclude '_stage' \
            --exclude '_build' \
            --exclude '*.bak' --exclude 'node_modules' --exclude '.wrangler'
          echo "  staged $(find _stage -type f | wc -l) files"

      - name: Preflight checks
        run: |
          set -uo pipefail
          fail=0

          # 1) Assets must actually be what their extension claims. A mirror script
          #    wrote the homepage over favicon/og images on three sites and shipped.
          #    On 2026-08-24 this caught SIX such files here - including manifest.json,
          #    which the old hardcoded list missed. So: check EVERY file by extension,
          #    never a fixed list.
          python3 - <<'ASSETS'
          import glob, io, json, os, sys
          bad = 0
          def head(p, n=512):
              return io.open(p, 'rb').read(n)
          for f in glob.glob('_stage/**/*', recursive=True):
              if not os.path.isfile(f): continue
              ext = os.path.splitext(f)[1].lower()
              rel = os.path.relpath(f, '_stage')
              h = head(f)
              if ext in ('.png', '.ico', '.jpg', '.jpeg', '.gif', '.webp'):
                  if h[:20].lstrip().lower().startswith((b'<!doctype', b'<html')):
                      print(f'::error::{rel} has a {ext} extension but contains HTML'); bad = 1
                      continue
                  magic = {'.png': b'\x89PNG', '.ico': b'\x00\x00\x01\x00',
                           '.gif': b'GIF8', '.webp': b'RIFF'}
                  if ext in magic and not h.startswith(magic[ext]):
                      print(f'::error::{rel} is not a valid {ext} (bad magic bytes)'); bad = 1
                  if ext in ('.jpg', '.jpeg') and not h.startswith(b'\xff\xd8'):
                      print(f'::error::{rel} is not a valid JPEG'); bad = 1
              elif ext == '.svg':
                  if b'<svg' not in h:
                      print(f'::error::{rel} has no <svg> element'); bad = 1
              elif ext in ('.json', '.webmanifest'):
                  try:
                      json.load(io.open(f, encoding='utf-8'))
                  except Exception as e:
                      print(f'::error::{rel} is not valid JSON: {e}'); bad = 1
          print('  every asset matches its extension' if not bad else '')
          sys.exit(bad)
          ASSETS
          [ $? -eq 0 ] || fail=1

          # 2) 404.html: no ads (Google policy forbids ads on error pages), must be noindex.
          if [ -f _stage/404.html ]; then
            grep -qE '<ins[^>]*adsbygoogle|googlesyndication' _stage/404.html \
              && { echo "::error::404.html carries AdSense - breaches Google programme policy"; fail=1; }
            grep -qi 'noindex' _stage/404.html || { echo "::error::404.html missing noindex"; fail=1; }
          fi

          # 3) Every real page carries monetisation + THIS SITE'S analytics, and a
          #    canonical matching its own path on the origin host.
          python3 - <<'PAGES'
          import glob, io, os, re, sys
          ORIGIN='https://coreskillai.com'; ADS='pub-5798786176755576'; GA='G-RKSK3LMNKN'
          bad=0; n=0
          for f in glob.glob('_stage/**/*.html', recursive=True):
              rel=os.path.relpath(f,'_stage')
              if rel=='404.html': continue
              h=io.open(f,encoding='utf-8',errors='replace').read(); n+=1
              if ADS not in h: print(f'::error::{rel} missing AdSense'); bad=1
              if GA  not in h: print(f'::error::{rel} missing GA4 {GA}'); bad=1
              want=ORIGIN+'/'+(os.path.dirname(rel).replace(os.sep,'/')+'/' if os.path.dirname(rel) else '')
              tag=f'rel="canonical" href="{want}"'
              if tag not in h:
                  got=h.split('rel="canonical" href="')[1].split('"')[0] if 'rel="canonical" href="' in h else '(none)'
                  print(f'::error::{rel} canonical is {got}, expected {want}'); bad=1
              # Trust pages. calculator-free.com - the one AdSense approved - links
              # About, Privacy, Terms and Contact from every page. Reviewers look for
              # a contact route; losing these links is a silent regression.
              # any two-letter directory is a language, not just the original four
              _first = rel.split('/')[0]
              pre = '/' + _first if re.fullmatch(r'[a-z]{2}', _first) else ''
              for slug in ('privacy', 'terms', 'contact'):
                  if f'href="{pre}/{slug}/"' not in h:
                      print(f'::error::{rel} footer is missing the {slug} link'); bad=1
          # Every page must have a UNIQUE title. Before 2026-08-25 all four language
          # versions shipped the ENGLISH title and description - 13-14 of 15 pages
          # per language - so /es/ /pt/ /fr/ /de/ announced themselves to Google as
          # English pages and read as near-duplicates of the English site. That is
          # the thin/duplicate pattern behind "low value content".
          # Titles must be unique WITHIN a language. Across languages they may
          # legitimately coincide - "Kontakt" is the same word in German, Polish,
          # Swedish, Danish and Norwegian - and hreflang already tells Google those
          # pages are alternates of each other, not duplicates.
          import collections
          titles = collections.defaultdict(list)
          for f in glob.glob('_stage/**/*.html', recursive=True):
              rel = os.path.relpath(f, '_stage')
              if rel == '404.html': continue
              h = io.open(f, encoding='utf-8', errors='replace').read()
              mt = re.search(r'<title>(.*?)</title>', h, re.S)
              if not mt:
                  print(f'::error::{rel} has no <title>'); bad = 1; continue
              first = rel.split('/')[0]
              lg = first if re.fullmatch(r'[a-z]{2}', first) else 'en'
              titles[(lg, mt.group(1).strip())].append(rel)
          for (lg, t), files in titles.items():
              if len(files) > 1:
                  print(f'::error::[{lg}] duplicate <title> on {len(files)} pages: {files[:4]} -> {t[:60]}')
                  bad = 1
          # And every non-English page must NOT reuse the English title.
          en_titles = {t for (lg, t) in titles if lg == 'en'}
          for (lg, t), files in titles.items():
              if lg != 'en' and t in en_titles:
                  print(f'::error::[{lg}] page still carries the ENGLISH title: {files[0]} -> {t[:60]}')
                  bad = 1
          print(f'  title/language pairs: {len(titles)}')
          print(f'  pages checked: {n}')
          sys.exit(bad)
          PAGES
          [ $? -eq 0 ] || fail=1

          # 4) ads.txt must name our publisher id.
          grep -q 'pub-5798786176755576' _stage/ads.txt || { echo "::error::ads.txt wrong or missing"; fail=1; }

          # 4b) MONETISATION INVARIANT. Every <ins class="adsbygoogle"> must be
          #     followed by its own push({}). Break the pairing and the page looks
          #     perfectly fine while earning nothing - that is exactly why
          #     worldunscrambler's best page served no ads for weeks.
          #     This mirrors calculator-free.com, the one approved site.
          python3 - <<'ADS'
          import re, io, glob, os, sys
          INS  = re.compile(r'<ins class="adsbygoogle"[^>]*>\s*</ins>')
          PUSH = re.compile(r'adsbygoogle\s*=\s*window\.adsbygoogle\s*\|\|\s*\[\]\s*\)\s*\.push')
          bad = ins_total = 0
          for f in glob.glob('_stage/**/*.html', recursive=True):
              rel = os.path.relpath(f, '_stage')
              h = io.open(f, encoding='utf-8', errors='replace').read()
              n_ins, n_push = len(INS.findall(h)), len(PUSH.findall(h))
              if rel == '404.html':
                  if n_ins or 'googlesyndication' in h:
                      print(f'::error::404.html carries ads - breaches Google policy'); bad = 1
                  continue
              if n_ins != n_push:
                  print(f'::error::{rel} has {n_ins} ad slot(s) but {n_push} push call(s) - '
                        f'unpaired slots earn nothing'); bad = 1
              ins_total += n_ins
          print(f'  ad slots paired with a push: {ins_total}')
          sys.exit(bad)
          ADS
          [ $? -eq 0 ] || fail=1

          # 5) Every test page must load its own script, and every script must parse.
          #    On 2026-08-24 a broken pick() shipped that skipped questions and threw
          #    after the last one. A syntax gate is the cheapest guard against a repeat.
          for j in _stage/js/*.js _stage/js/tests/*.js; do
            node --check "$j" || { echo "::error::$j is not valid JavaScript"; fail=1; }
          done
          for t in iq reaction-time memory pattern color-vision big-five eq focus typing; do
            p="_stage/tests/$t/index.html"
            [ -f "$p" ] || { echo "::error::missing test page $t"; fail=1; continue; }
            grep -q "/js/tests/$t.js" "$p" || { echo "::error::$t page does not load /js/tests/$t.js"; fail=1; }
          done

          # 6) ROOT-CAUSE GUARD for the 2026-08-24 result-panel bugs.
          #    Cause: translation VALUES carried punctuation/emoji that the template
          #    also printed ("3% % of people", doubled clipboard icon), and keys were
          #    reused for a second meaning (the Category card rendered "Score Breakdown").
          python3 - <<'I18N'
          import re, io, glob, os, sys
          bad=0

          def parse_block(b):
              """Walk the object body skipping string literals, so prose inside a
              value (e.g. "the sequence: ...") is never mistaken for a key."""
              out={}; i=0; n=len(b)
              while i<n:
                  if b[i]=='"':
                      i+=1
                      while i<n and b[i]!='"': i+= 2 if b[i]=='\\' else 1
                      i+=1; continue
                  m=re.match(r'([A-Za-z_]\w*)\s*:\s*"', b[i:])
                  if m:
                      j=i+m.end(); v=''
                      while j<n and b[j]!='"':
                          v+=b[j]; j+= 2 if b[j]=='\\' else 1
                      out[m.group(1)]=v; i=j+1; continue
                  i+=1
              return out

          # One file per language under js/i18n/ - a visitor loads only English plus
          # their own language, never all 43 (that would have been 338 KB).
          parsed={}
          for f in sorted(glob.glob('_stage/js/i18n/*.js')):
              lg=os.path.basename(f)[:-3]
              body=io.open(f,encoding='utf-8').read()
              m=re.search(r'window\.TRANSLATIONS\.%s = \{\n(.*?)\n\};'%lg, body, re.S)
              if not m:
                  print('::error::%s does not define window.TRANSLATIONS.%s'%(f,lg)); sys.exit(1)
              parsed[lg]=parse_block(m.group(1))
          if 'en' not in parsed:
              print('::error::js/i18n/en.js missing'); sys.exit(1)

          # a) every language must define every English key
          base=set(parsed['en'])
          for l,d in parsed.items():
              miss=base-set(d)
              if miss:
                  print(f'::error::translations[{l}] missing key(s): {sorted(miss)[:6]}'); bad=1

          vals={}
          for l,d in parsed.items():
              for k,v in d.items(): vals.setdefault(k,{})[l]=v

          # b) a value must not repeat decoration the template already prints
          #    ("${p}% ${_t('percentile_suffix')}" where the value starts with '%')
          for f in glob.glob('_stage/js/**/*.js', recursive=True):
              s=io.open(f,encoding='utf-8',errors='replace').read()
              for pre,key in re.findall(r"(\S)\s*\$\{_t\('(\w+)'", s):
                  for l,v in vals.get(key,{}).items():
                      if v[:1] and v[:1]==pre:
                          print(f'::error::{os.path.basename(f)}: template prints "{pre}" then _t({key}) '
                                f'whose {l} value also starts with it -> doubled'); bad=1

          # c) no fabricated ordinals ("3th")
          for f in glob.glob('_stage/js/**/*.js', recursive=True):
              s=io.open(f,encoding='utf-8',errors='replace').read()
              for m in re.findall(r'\$\{[^}]+\}th\b', s):
                  print(f'::error::{os.path.basename(f)}: {m} builds a bogus ordinal - use window.ordinal()'); bad=1

          print('  translation/template integrity OK' if not bad else '')
          sys.exit(bad)
          I18N
          [ $? -eq 0 ] || fail=1

          # 7) Sitemap must parse and every URL must map to a real file.
          python3 - <<'SM'
          import re, io, os, sys
          import xml.etree.ElementTree as ET
          ET.parse('_stage/sitemap.xml')
          locs=re.findall(r'<loc>([^<]+)</loc>', io.open('_stage/sitemap.xml',encoding='utf-8').read())
          bad=0
          for u in locs:
              path=re.sub(r'^https?://[^/]+','',u).strip('/')
              target=os.path.join('_stage', path, 'index.html') if path else '_stage/index.html'
              if not os.path.isfile(target):
                  print(f'::error::sitemap lists {u} but {target} does not exist'); bad=1
          if not locs: print('::error::sitemap has no urls'); bad=1
          print(f'  sitemap urls: {len(locs)}')
          sys.exit(bad)
          SM
          [ $? -eq 0 ] || fail=1

          [ "$fail" -eq 0 ] || exit 1
          echo "  all preflight checks passed"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _stage --project-name=${{ env.PROJECT }} --branch=main --commit-dirty=true

      - name: Purge edge cache
        run: |
          set -euo pipefail
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | tee /tmp/purge.json
          grep -q '"success":true' /tmp/purge.json || echo "::warning::cache purge did not report success"
          sleep 10

      - name: Verify live
        run: |
          set -uo pipefail
          S="${{ env.SERVED }}"; V="${{ steps.build.outputs.id }}"; fail=0
          chk(){ printf '  %-46s' "$1"; }

          code=$(curl -s -o /tmp/h.html -w '%{http_code}' "$S/?v=$V")
          chk "homepage 200"; [ "$code" = 200 ] && echo OK || { echo "FAIL ($code)"; fail=1; }
          chk "homepage AdSense"; grep -q "$ADSENSE" /tmp/h.html && echo OK || { echo FAIL; fail=1; }
          chk "homepage GA4 ($GA4)"; grep -q "$GA4" /tmp/h.html && echo OK || { echo FAIL; fail=1; }

          chk "ads.txt correct"
          curl -s "$S/ads.txt" | grep -q 'pub-5798786176755576' && echo OK || { echo FAIL; fail=1; }

          chk "apex 301s to www"
          c=$(curl -s -o /dev/null -w '%{http_code}' "https://coreskillai.com/tests/iq/")
          [ "$c" = 301 ] || [ "$c" = 308 ] && echo "OK ($c)" || { echo "FAIL ($c)"; fail=1; }

          chk "canonical-fix Worker still rewrites to www"
          # Two things this check needs, both learned the hard way:
          #  -L        Pages 301s between /x/ and /x; without it curl greps an empty body.
          #  Accept/UA the Worker only rewrites HTML responses, so a bare "Accept: */*"
          #            request comes back unrewritten and the check fails for no reason.
          curl -sL -H 'Accept: text/html,application/xhtml+xml' \
               -A 'Mozilla/5.0 (compatible; coreskillai-deploy-check)' \
               "$S/tests/iq/" > /tmp/canon.html
          if grep -q 'rel="canonical" href="https://www.coreskillai.com/tests/iq/"' /tmp/canon.html; then
            echo OK
          else
            echo "FAIL - Worker not rewriting"
            echo "::warning::canonical actually served: $(grep -o 'rel=\"canonical\" href=\"[^\"]*\"' /tmp/canon.html | head -1)"
            fail=1
          fi

          # All nine tests must be reachable and serve their script.
          for t in iq reaction-time memory pattern color-vision big-five eq focus typing; do
            chk "test page /tests/$t/"
            c=$(curl -s -o /dev/null -w '%{http_code}' "$S/tests/$t/")
            j=$(curl -s -o /dev/null -w '%{http_code}' "$S/js/tests/$t.js")
            if [ "$c" = 200 ] && [ "$j" = 200 ]; then echo OK; else echo "FAIL (page $c, js $j)"; fail=1; fi
          done

          chk "iq.js carries the double-click guard"
          curl -s "$S/js/tests/iq.js" | grep -q "answers\[current\]!==undefined" \
            && echo OK || { echo "FAIL - regression, pick() is re-entrant again"; fail=1; }

          chk "no doubled percent in served translations"
          curl -s "$S/js/translations.js" | grep -q 'percentile_suffix:"%' \
            && { echo "FAIL - percentile_suffix carries a % again"; fail=1; } || echo OK

          chk "404 page has no ads"
          curl -s "$S/definitely-not-a-page-xyz" | grep -qE '<ins[^>]*adsbygoogle' && { echo FAIL; fail=1; } || echo OK

          [ "$fail" -eq 0 ] || { echo "::error::live verification failed"; exit 1; }
          echo ""
          echo "  build $V verified live"
